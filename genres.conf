# Dictionnaire de genres pour scdl
#
# Format :   Nom Canonique = variante, variante, variante
#
# La comparaison ignore la casse, les espaces, les tirets et la ponctuation :
# "Hard-Techno", "HARD TECHNO", "hardtechno" et "Hard Techno" sont identiques.
# Le nom canonique est automatiquement sa propre variante — inutile de le répéter.
#
# Un genre absent de ce fichier est conservé tel quel (juste nettoyé), il n'est
# jamais perdu. Pour le rattacher, ajoute-le en variante sur la bonne ligne.
#
# Les valeurs multiples sont coupées au premier "/" ou "|" :
# "Hard Techno/Industrial" est traité comme "Hard Techno".

# ---------------------------------------------------------------- techno ---
Techno            = tekno, technomusic, puretechno, rawtechno, clubtechno
Hard Techno       = hardtechno, hardtekno, hardtechnorave, hardtechnoindustrial, htechno
Industrial Techno = industrialtechno, industrial, industrialhardtechno
Acid Techno       = acidtechno
Melodic Techno    = melodictechno, melodichousetechno, melodichouseandtechno
Peak Time Techno  = peaktimetechno, peaktime, peaktimedrivingtechno, driving techno
Minimal Techno    = minimaltechno, minimal, minimaldeeptech
Hypnotic Techno   = hypnotictechno, hypnotic
Hybrid Techno     = hybridtechno, hybrid
Hardgroove        = hardgroove, hardgroovetechno, groovytechno
Detroit Techno    = detroittechno
Dub Techno        = dubtechno
Schranz           = schranz, schranzcore

